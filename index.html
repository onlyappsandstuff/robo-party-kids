<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Robo-Party</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  /* Layout: dunkler Rahmen, Raum-Canvas mittig im Stage-Bereich, grosse Touch-Leiste darunter. Bewusst ein einziger heller Spiel-Look. */
  --bg:#121a3a;
  --panel:#1d2756;
  --panel-2:#2a3873;
  --ink:#f4f6ff;
  --muted:#aab5e8;
  --accent:#ffc93c;
  --good:#38d39f;
  --warn:#ff6b6b;
  --font-display:'Fredoka','Trebuchet MS',system-ui,sans-serif;
  color-scheme:dark;
}
[hidden]{display:none!important}
html,body{height:100%}
body{
  margin:0;
  background:var(--bg);
  color:var(--ink);
  font-family:var(--font-display);
  font-size:18px;
  padding-block:8px;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  box-sizing:border-box;
  overflow:hidden;
  -webkit-user-select:none;user-select:none;
  -webkit-tap-highlight-color:transparent;
}
.app{height:100%;display:flex;flex-direction:column;gap:8px;min-width:0}
.top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px 16px}
h1{margin:0;font-size:2rem;font-weight:700;letter-spacing:.01em;display:flex;align-items:center;gap:10px;text-wrap:balance}
h1 span{color:var(--accent)}
h1 svg{width:42px;height:42px;flex:none}
.stats{display:flex;flex-wrap:wrap;gap:8px;align-items:center;min-width:0}
.chip,.meter{background:var(--panel);border-radius:16px;padding:6px 14px;display:flex;align-items:center;gap:8px;font-weight:600;font-variant-numeric:tabular-nums}
.lbl{font-size:.7rem;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);font-weight:500}
.bar{width:170px;max-width:30vw;height:18px;border-radius:8px;background:var(--panel-2);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#3d9be9,#38d39f);border-radius:8px;transition:width .25s}
.stage{flex:1;min-height:0;position:relative}
canvas{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);border-radius:18px;box-shadow:0 0 0 4px #33427f,0 14px 30px rgba(0,0,0,.45);touch-action:none;background:#c4d6ea}
.hint{position:absolute;left:50%;top:14px;transform:translateX(-50%);background:rgba(18,26,58,.9);border-radius:20px;padding:8px 18px;font-weight:500;pointer-events:none;text-align:center;max-width:90%}
.banner{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);background:var(--panel);border-radius:28px;padding:22px 30px;text-align:center;display:grid;gap:10px;justify-items:center;box-shadow:0 0 0 4px var(--accent),0 20px 50px rgba(0,0,0,.5);animation:pop .35s ease-out;max-width:calc(100% - 32px)}
.banner h2{margin:0;font-size:2.4rem;color:var(--accent);text-wrap:balance}
.banner p{margin:0;color:var(--muted);font-weight:500}
.stars{display:flex;gap:6px}
.stars svg{width:52px;height:52px}
.menu{position:absolute;left:50%;bottom:12px;transform:translateX(-50%);background:var(--panel);border-radius:30px;padding:14px;display:flex;flex-wrap:wrap;gap:12px;justify-content:center;align-items:center;box-shadow:0 0 0 3px var(--panel-2),0 16px 40px rgba(0,0,0,.5);max-width:calc(100% - 24px);z-index:5}
.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
@keyframes pop{from{transform:translate(-50%,-50%) scale(.7);opacity:0}to{transform:translate(-50%,-50%) scale(1);opacity:1}}
@media (prefers-reduced-motion:reduce){.banner{animation:none}}
.tray{background:var(--panel);border-radius:24px;padding:10px 14px;display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:10px 18px}
.bots{display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:center}
.bots .lbl{max-width:5.5em;line-height:1.1}
button{font-family:var(--font-display);cursor:pointer;border:0;color:var(--ink)}
button:focus-visible{outline:3px solid #fff;outline-offset:2px}
.botbtn{width:70px;height:70px;border-radius:50%;background:var(--panel-2);padding:5px;touch-action:none;display:grid;place-items:center}
.botbtn svg{width:100%;height:100%;pointer-events:none}
.botbtn:active{transform:scale(.94)}
.go{min-width:180px;height:74px;border-radius:37px;background:var(--good);color:#082a20;font-size:1.6rem;font-weight:700;display:flex;align-items:center;justify-content:center;gap:10px;padding:0 22px}
.go svg{width:30px;height:30px;fill:currentColor}
.go.on{background:var(--warn);color:#3a0a0a}
.tools{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.tool{height:58px;border-radius:29px;background:var(--panel-2);padding:0 18px;display:flex;align-items:center;gap:8px;font-size:1.1rem;font-weight:600}
.tool svg{width:28px;height:28px;fill:currentColor;flex:none}
.tool[aria-pressed="true"]{background:var(--accent);color:#2b2100}
.tool.plain{background:#3b4b94}
.tool .slash{display:none}
.tool.muted .slash{display:block}
.tool:active,.go:active{transform:scale(.96)}
#ghost{position:fixed;left:0;top:0;pointer-events:none;z-index:50;opacity:.92;filter:drop-shadow(0 6px 8px rgba(0,0,0,.35))}
#ghost svg{width:100%;height:100%}
@media (max-width:640px){
  h1{font-size:1.3rem}
  .bar{width:90px}
  .tray .tool span{display:none}
  .tool{padding:0 14px}
}
.rotate{display:none;text-align:center;color:var(--muted);font-weight:500;font-size:.9rem}
@media (max-aspect-ratio:5/4){.rotate{display:block}}
@media (min-aspect-ratio:5/4){
  .app{display:grid;grid-template-columns:minmax(0,1fr) 200px;grid-template-rows:auto minmax(0,1fr);gap:10px}
  .stage{grid-column:1;grid-row:1 / span 2}
  .top{grid-column:2;grid-row:1;flex-direction:column;align-items:stretch}
  h1{display:none}
  .stats{flex-direction:column;align-items:stretch;gap:6px}
  .meter,.chip{padding:6px 12px}
  .meter .bar{flex:1;width:auto;max-width:none;min-width:30px}
  .chip{justify-content:space-between}
  .tray{grid-column:2;grid-row:2;flex-direction:column;flex-wrap:nowrap;align-items:stretch;justify-content:flex-start;gap:10px;padding:10px;overflow-y:auto;min-height:0}
  .bots{display:grid;grid-template-columns:repeat(3,1fr);justify-items:center;gap:6px;order:1}
  .botbtn{width:58px;height:58px}
  .bots .lbl{grid-column:1/-1;max-width:none;text-align:center}
  .go{width:100%;min-width:0;box-sizing:border-box;height:62px;order:-2}
  #btnMenu{order:-1}
  .tray .tool{justify-content:center}
  .tray .tool span{display:inline}
}
@media (min-aspect-ratio:5/4) and (max-height:640px){
  .botbtn{width:56px;height:56px}
  .go{height:56px;font-size:1.4rem}
  .tray .tool{height:48px}
  .chip,.meter{padding:3px 12px}
}
</style>

</head>
<body>
<div class="app">
  <header class="top">
    <h1>
      <svg viewBox="0 0 48 48" aria-hidden="true"><circle cx="24" cy="24" r="22" fill="#2d3240"/><path d="M34.2 6.5A19.5 19.5 0 0 1 34.2 41.5" fill="none" stroke="#161a24" stroke-width="4.5"/><circle cx="24" cy="24" r="18" fill="#ffc93c"/><circle cx="21" cy="21" r="12" fill="rgba(255,255,255,.25)"/><circle cx="26" cy="24" r="7.5" fill="#222735" stroke="#38d39f" stroke-width="2.6"/></svg>
      <div>Robo-<span>Party</span></div>
    </h1>
    <div class="stats">
      <div class="meter"><span class="lbl">Sauber</span><div class="bar"><i id="barFill"></i></div><b id="pct">0%</b></div>
      <div class="chip"><span class="lbl">Zeit</span><b id="time">0:00</b></div>
      <div class="chip"><span class="lbl">Roboter</span><b><span id="count">0</span>/<span id="max">50</span></b></div>
    </div>
  </header>
  <div class="rotate">Tipp: Tablet quer halten, dann wird das Spielfeld größer.</div>

  <main class="stage" id="stage">
    <canvas id="cv" aria-label="Spielfeld: ein Zimmer von oben mit Saugrobotern"></canvas>
    <div class="hint" id="hint">Roboter in den Raum ziehen oder antippen. Dann Start drücken!</div>
    <div class="banner" id="banner" hidden>
      <h2>Blitzblank!</h2>
      <div class="stars" id="stars"></div>
      <p id="bannerText"></p>
      <div class="row">
        <button class="tool" id="bnMore" type="button">Weiter spielen</button>
        <button class="tool" id="bnDirt" type="button" style="background:var(--accent);color:#2b2100">Neuer Dreck</button>
      </div>
    </div>
  <div class="menu" id="menu" hidden>
      
    <div class="tools">
      <button class="tool" id="btnAuto" type="button" aria-pressed="false" title="Roboter fahren selbst zur Ladestation und zum Mülleimer">
        <svg viewBox="0 0 24 24"><path d="M13 2 5 14h6l-1 8 9-13h-6z"/></svg><span>Auto-Helfer</span>
      </button>
      <button class="tool" id="btnParty" type="button" aria-pressed="false">
        <svg viewBox="0 0 24 24"><polygon points="12,3 14.6,9 21,9.5 16,13.8 17.7,20 12,16.6 6.3,20 8,13.8 3,9.5 9.4,9"/></svg><span>Party</span>
      </button>
      <button class="tool" id="btnSound" type="button" aria-pressed="true">
        <svg viewBox="0 0 24 24"><path d="M4 9h4l5-4v14l-5-4H4z"/><path d="M16 9c2 2 2 4 0 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><path class="slash" d="M3 3l18 18" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/></svg><span>Ton</span>
      </button>
      <button class="tool plain" id="btnDirt" type="button">
        <svg viewBox="0 0 24 24"><circle cx="7" cy="14" r="3.2"/><circle cx="15" cy="8" r="2.6"/><circle cx="16.5" cy="17" r="2.2"/></svg><span>Dreck!</span>
      </button>
      <button class="tool plain" id="btnFull" type="button">
        <svg viewBox="0 0 24 24"><path d="M4 9V4h5v2H6v3zM15 4h5v5h-2V6h-3zM4 15h2v3h3v2H4zM18 15h2v5h-5v-2h3z"/></svg><span>Vollbild</span>
      </button>
      <button class="tool plain" id="btnReset" type="button">
        <svg viewBox="0 0 24 24"><path d="M12 5a7 7 0 1 0 7 7h-2a5 5 0 1 1-5-5v3l5-4-5-4z"/></svg><span>Neu</span>
      </button>
    </div>
    </div>
  </main>

  <footer class="tray">
    <div class="bots" id="bots">
      <span class="lbl">Roboter ziehen</span>
    </div>
    <button class="go" id="btnGo" type="button" aria-pressed="false">
      <svg viewBox="0 0 24 24" id="goIcon"><path d="M7 4l13 8-13 8z"/></svg><span id="goText">Start</span>
    </button>
    <button class="tool" id="btnMenu" type="button" aria-pressed="false" aria-controls="menu">
      <svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round"/></svg><span>Menü</span>
    </button>
  </footer>
</div>

<script>
(() => {
'use strict';
const _sr = document.getElementById('stage').getBoundingClientRect();
const W = 1000, CELL = 20;
const H = Math.round(Math.min(900, Math.max(600, _sr.width > 50 ? W * _sr.height / _sr.width : 600)) / 20) * 20;
const GX = W / CELL, GY = H / CELL;
const R = 24, MAXBOTS = 50, TAU = Math.PI * 2;
const COLORS = ['#ff5a5f', '#ffc93c', '#2ec4b6', '#3d9be9', '#8e5cf6', '#ff7bac'];
const rr = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const angDiff = (a, b) => ((a - b + Math.PI * 3) % TAU) - Math.PI;
const $ = id => document.getElementById(id);

const cv = $('cv'), ctx = cv.getContext('2d');
const stageEl = $('stage');
const mk = (w, h) => { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; };
const floorC = mk(W, H), dirtC = mk(W, H), furnC = mk(W, H);
const fctx = floorC.getContext('2d'), dctx = dirtC.getContext('2d'), uctx = furnC.getContext('2d');

/* ---------- Raum ---------- */
const OBST = [];
const BIN = { x: 0, y: 0, r: 40, zone: 78 };
const DOCKS = [0, 1, 2, 3].map(() => ({ x: 0, y: H - 62, w: 68, h: 62, slots: [null] }));
const slotPos = (d, i) => ({ x: d.x + d.w / 2, y: H - 38 });
const pick = a => a[(Math.random() * a.length) | 0];

function rrect(g, x, y, w, h, r) {
  r = Math.min(r, w / 2, h / 2);
  g.beginPath();
  g.moveTo(x + r, y);
  g.arcTo(x + w, y, x + w, y + h, r);
  g.arcTo(x + w, y + h, x, y + h, r);
  g.arcTo(x, y + h, x, y, r);
  g.arcTo(x, y, x + w, y, r);
  g.closePath();
}

const FLOORS = [
  { kind: 'planks', tones: ['#bfd2e8', '#c8daed', '#c2d5ea'], seam: 'rgba(60,90,130,.2)', wall: '#566bb0' },
  { kind: 'planks', tones: ['#e0c59a', '#d8bb8d', '#e6cca4'], seam: 'rgba(110,70,30,.28)', wall: '#8a5a3a' },
  { kind: 'planks', tones: ['#d6cdee', '#cfc5ea', '#dbd3f0'], seam: 'rgba(90,70,150,.22)', wall: '#7a63b8' },
  { kind: 'planks', tones: ['#b8dcae', '#c0e2b6', '#b2d6a8'], seam: 'rgba(40,100,50,.22)', wall: '#4f8f55' },
  { kind: 'tiles', tones: ['#cfeee6', '#c4e8de', '#d6f2ec'], seam: 'rgba(40,110,95,.3)', wall: '#3b8f80' },
  { kind: 'checker', tones: ['#eef3f8', '#b9cbe0'], seam: 'rgba(60,90,130,.12)', wall: '#6a78b5' },
  { kind: 'checker', tones: ['#ffffff', '#ffd2dc'], seam: 'rgba(160,60,90,.12)', wall: '#c35a7a' }
];
const RUGS = [
  ['#ffd98a', '#fff7e0', '#ff9fb0', '#fff7e0', '#7fd6c9'],
  ['#7a63d8', '#e8e0ff', '#ff7bac', '#e8e0ff', '#ffc93c'],
  ['#2ec4b6', '#e6fffb', '#3d9be9', '#e6fffb', '#ff5a5f'],
  ['#ff8a5b', '#fff1e6', '#3d9be9', '#fff1e6', '#ffd84a']
];
const SOFA_COLS = ['#ff6f61', '#3d9be9', '#8e5cf6', '#2ec4b6', '#ffb020', '#ff7bac'];
const WOOD_COLS = ['#c98f5b', '#b07a4a', '#d9a56f', '#9a7352'];
const SHELF_COLS = ['#8e5f3d', '#6f4a31', '#b07a4a'];
const POT_COLS = ['#b4693c', '#e07a5f', '#8e5cf6', '#3d9be9'];
const BIN_COLS = ['#7b8aa6', '#2ec4b6', '#ffb020', '#8e5cf6'];
let theme = FLOORS[0], rug = null;

function genLayout() {
  theme = pick(FLOORS);
  rug = Math.random() < .8 ? { x: rr(W * .3, W * .7), y: rr(H * .3, H * .6), s: rr(.75, 1.1), set: pick(RUGS) } : null;
  // Ladestationen am unteren Rand
  const dgap = rr(50, 110), dstart = rr(60, W - 60 - (4 * 68 + 3 * dgap));
  DOCKS.forEach((d, i) => { d.x = dstart + i * (68 + dgap); d.slots.fill(null); });
  OBST.length = 0;
  const placed = [];
  const fits = (x, y, w, h, gap, ymin) => x >= 56 && x + w <= W - 56 && y >= ymin && y + h <= H - 140 &&
    placed.every(p => x > p.x + p.w + gap || x + w < p.x - gap || y > p.y + p.h + gap || y + h < p.y - gap);
  const put = (w, h, top) => {
    for (let k = 0; k < 300; k++) {
      const x = rr(56, W - 56 - w), y = top ? 28 : rr(40, H - 140 - h);
      if (fits(x, y, w, h, 70, top ? 0 : 40)) { placed.push({ x, y, w, h }); return { x, y }; }
    }
    return null;
  };
  let p = put(80, 80);
  if (p) { BIN.x = p.x + 40; BIN.y = p.y + 40; OBST.push({ t: 'circ', x: BIN.x, y: BIN.y, r: 40, kind: 'bin', col: pick(BIN_COLS) }); }
  else { BIN.x = W - 100; BIN.y = 300; OBST.push({ t: 'circ', x: BIN.x, y: BIN.y, r: 40, kind: 'bin', col: BIN_COLS[0] }); }
  const rect = (kind, w, h, extra, top) => { const q = put(w, h, top); if (q) OBST.push(Object.assign({ t: 'rect', x: q.x, y: q.y, w, h, kind }, extra)); };
  rect('sofa', 290, 120, { sticky: true, col: pick(SOFA_COLS) });
  rect('table', 220, 120, { sticky: true, col: pick(WOOD_COLS) });
  if (Math.random() < .75) rect('shelf', 270, 64, { col: pick(SHELF_COLS) }, true);
  if (Math.random() < .8) rect('toys', 140, 110, { sticky: true, col: pick(SOFA_COLS) });
  if (Math.random() < .8) rect('chair', 120, 120, { sticky: true, col: pick(SOFA_COLS) });
  if (Math.random() < .8) { const q = put(80, 80); if (q) OBST.push({ t: 'circ', x: q.x + 40, y: q.y + 40, r: 40, kind: 'plant', col: pick(POT_COLS) }); }
}

function drawFloor() {
  const g = fctx, th = theme;
  g.fillStyle = th.tones[0]; g.fillRect(0, 0, W, H);
  g.strokeStyle = th.seam; g.lineWidth = 2;
  if (th.kind === 'planks') {
    const ph = 56;
    for (let row = 0; row * ph < H; row++) {
      let x = -((row * 173) % 260);
      while (x < W) {
        const w = 200 + (Math.abs(row * 53 + (x | 0)) % 4) * 25;
        g.fillStyle = th.tones[Math.abs(row * 7 + ((x + 400) / 50 | 0)) % 3];
        g.fillRect(x, row * ph, w, ph);
        g.strokeRect(x + .5, row * ph + .5, w - 1, ph - 1);
        x += w;
      }
    }
  } else {
    const ts = 70;
    for (let r = 0; r * ts < H; r++) for (let c = 0; c * ts < W; c++) {
      g.fillStyle = th.kind === 'tiles' ? th.tones[(r * 7 + c * 13) % 3] : th.tones[(r + c) % 2];
      g.fillRect(c * ts, r * ts, ts, ts);
      g.strokeRect(c * ts + .5, r * ts + .5, ts - 1, ts - 1);
    }
  }
  if (rug) {
    g.save(); g.translate(rug.x, rug.y);
    const rx = [310, 270, 235, 190, 160], ry = [200, 170, 145, 112, 88];
    rug.set.forEach((c, i) => { g.fillStyle = c; g.beginPath(); g.ellipse(0, 0, rx[i] * rug.s, ry[i] * rug.s, 0, 0, TAU); g.fill(); });
    g.restore();
  }
  g.strokeStyle = th.wall; g.lineWidth = 16; g.strokeRect(0, 0, W, H);
  g.strokeStyle = 'rgba(255,255,255,.25)'; g.lineWidth = 3; g.strokeRect(10, 10, W - 20, H - 20);
}

function drawFurn() {
  const g = uctx;
  g.clearRect(0, 0, W, H);
  OBST.forEach(o => {
    g.fillStyle = 'rgba(20,30,70,.2)';
    if (o.t === 'rect') { rrect(g, o.x + 6, o.y + 9, o.w, o.h, 22); g.fill(); }
    else { g.beginPath(); g.arc(o.x + 6, o.y + 9, o.r, 0, TAU); g.fill(); }
  });
  // Absaugstationen mit Rampe
  DOCKS.forEach(d => {
    const x = d.x, w = d.w, top = H - 62;
    g.strokeStyle = 'rgba(255,255,255,.55)'; g.lineWidth = 3; g.setLineDash([7, 7]);
    rrect(g, x - 12, H - 110, w + 24, 110, 14); g.stroke(); g.setLineDash([]);
    // Rampe
    g.fillStyle = 'rgba(20,30,70,.18)';
    g.beginPath(); g.moveTo(x + 6, top - 26 + 4); g.lineTo(x + w, top - 26 + 4); g.lineTo(x + w - 6, top + 8); g.lineTo(x + 14, top + 8); g.closePath(); g.fill();
    g.fillStyle = '#d5dbec'; g.strokeStyle = '#8c97bc'; g.lineWidth = 2;
    g.beginPath(); g.moveTo(x + 3, top - 26); g.lineTo(x + w - 3, top - 26); g.lineTo(x + w - 9, top + 4); g.lineTo(x + 9, top + 4); g.closePath(); g.fill(); g.stroke();
    g.strokeStyle = '#aeb8d6'; g.lineWidth = 1.5;
    for (let k = 1; k < 4; k++) {
      const yy = top - 26 + k * 7, f = k / 4.2;
      g.beginPath(); g.moveTo(x + 3 + 6 * f, yy); g.lineTo(x + w - 3 - 6 * f, yy); g.stroke();
    }
    // Gehaeuse
    g.fillStyle = 'rgba(20,30,70,.2)'; rrect(g, x + 3, top + 4, w, 68, 12); g.fill();
    g.fillStyle = '#f2f4fa'; g.strokeStyle = '#7d89b0'; g.lineWidth = 2.5; rrect(g, x, top, w, 70, 12); g.fill(); g.stroke();
    g.fillStyle = '#dfe4f3'; rrect(g, x + 6, top + 6, w - 12, 34, 8); g.fill();

        if (startSeek(b, 'charge')) sfx.pop();
        else { b.st = was === 'dead' ? 'dead' : b.st; b.bat = ob; b.shake = .5; sfx.help(); }
      } else if (need === 'bin') { startSeek(b, 'bin'); sfx.pop(); }
      else if (b.st === 'dead') b.shake = .5;
      else { b.a = rr(0, TAU); b.shake = .25; }
    }
  }
}
window.addEventListener('pointerup', endPointer);
window.addEventListener('pointercancel', endPointer);

const menuEl = $('menu'), btnMenu = $('btnMenu');
function setMenu(v) { menuEl.hidden = !v; btnMenu.setAttribute('aria-pressed', v); }
btnMenu.addEventListener('click', () => { audio(); setMenu(menuEl.hidden); });
$('btnFull').addEventListener('click', () => {
  try {
    const d = document, el = d.documentElement;
    if (d.fullscreenElement || d.webkitFullscreenElement) (d.exitFullscreen || d.webkitExitFullscreen).call(d);
    else { const f = el.requestFullscreen || el.webkitRequestFullscreen; if (f) { const r = f.call(el); if (r && r.catch) r.catch(() => {}); } }
  } catch (e) { /* nicht erlaubt */ }
  setMenu(false);
});
$('btnGo').addEventListener('click', () => { audio(); setRunning(!running); setMenu(false); });
$('btnAuto').addEventListener('click', e => { audio(); auto = !auto; e.currentTarget.setAttribute('aria-pressed', auto); });
$('btnParty').addEventListener('click', e => { audio(); party = !party; e.currentTarget.setAttribute('aria-pressed', party); beatT = 0; beatStep = 0; });
$('btnSound').addEventListener('click', e => {
  audio(); muted = !muted; e.currentTarget.setAttribute('aria-pressed', !muted); e.currentTarget.classList.toggle('muted', muted);
});
$('btnDirt').addEventListener('click', () => { audio(); sfx.pop(); newDirt(); setMenu(false); });
$('btnReset').addEventListener('click', () => {
  bots.forEach(releaseSlot); bots = []; particles.length = 0; won = false; roundTime = 0; $('banner').hidden = true;
  DOCKS.forEach(d => d.slots.fill(null)); setRunning(false); setMenu(false); newRoom(); resetDirt(); startBots(); updateUI();
});
$('bnMore').addEventListener('click', () => { $('banner').hidden = true; });
$('bnDirt').addEventListener('click', () => { audio(); sfx.pop(); newDirt(); });
$('max').textContent = MAXBOTS;

function startBots() {
  for (let i = 0; i < 6; i++) { const p = freeSpot(); const b = makeBot(COLORS[i % 6], p.x, p.y); b.a = rr(0, TAU); }
  $('hint').hidden = false;
}

/* Start */
newRoom(); resetDirt(); startBots(); fit(); updateUI();
let last = performance.now(), helpT = 0;
function frame(now) {
  const dt = Math.min(.05, (now - last) / 1000); last = now;
  step(dt);
  helpT -= dt;
  if (helpT <= 0 && bots.some(b => needOf(b))) { helpT = 1.6; sfx.help(); }
  uiT -= dt; if (uiT <= 0) { uiT = .2; updateUI(); }
  render(now / 1000);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
})();
</script>
